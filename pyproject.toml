[project]
name = "tabula"
version = "0.1.0"
description = "Reinforcement learning from scratch: agents that start from a blank slate"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tabula = "tabula.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deterministic by default: a flaky RL test is worse than no test.
addopts = "-q -m 'not slow'"
markers = [
    # Real training runs, minutes rather than seconds. Excluded by default so a
    # normal test pass stays fast; CI runs them separately.
    "slow: full training runs, excluded from the default pass",
]

[tool.setuptools.packages.find]
include = ["tabula*"]
